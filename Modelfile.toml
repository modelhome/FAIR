name = "Emissions Climate Projection"
description = "Runs the FaIR reduced-complexity climate model to project global temperature, atmospheric CO₂, and radiative forcing from a greenhouse-gas emissions scenario. Fast enough for scenario sweeps and policy analysis; falls back to bundled defaults when no input is supplied. Feeds Climate Damage Premium (DICE)."
run = "docker run --rm -v \"$PWD/run:/run\" ${IMAGE} ${ARGS} > run/climate_projections.output.json"

image = "fair-runner:local"
args = ["{input:emissions}"]

[runner]
entrypoint = "runner.py"
language = "python"

[build]
dockerfile = "Dockerfile"

[resources]
memory = "4Gi"
cpu = "2"

[[inputs]]
# TODO: this should eventually support URLs as well as local files
name = "emissions"

[inputs.schema]
type = "object"
required = []


[[outputs]]
name = "climate_projections"


[outputs.schema]
type = "object"
required = ["timebounds", "scenarios", "configs", "temperature_K", "co2_ppm", "forcing_sum_Wm2"]
properties.timebounds.type = "array"
properties.scenarios.type = "array"
properties.configs.type = "array"
properties.temperature_K.type = "object"
properties.co2_ppm.type = "object"
properties.forcing_sum_Wm2.type = "object"
